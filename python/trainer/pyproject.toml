[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otterlogic-trainer"
version = "0.2.0"
description = "Trains a model on an OtterLogic dataset folder and writes it as a self-describing .onnx."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "skl2onnx>=1.17",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["otterlogic_trainer*"]
